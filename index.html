function render(){$('#nv').innerHTML='<h1>THEMEVERSE</h1>'+PAGES.map(p=>`<button class="${S.page==p[0]?'on':''}" data-p="${p[0]}">${p[1]}</button>`).join('');
$('#nv').onclick=e=>{const p=e.target.dataset.p;if(p)go(p)};const m=$('#mn'),R={lib,studio,mixer,prompt:promptPg,pal,fav,help}[S.page];m.innerHTML=R();if(R.after)R.after()}
function lib(){const a=list();return`<div class="bar"><input id="q" type="search" placeholder="Search name, mood, color… (Ctrl+K)" value="${esc(S.q)}" aria-label="Search themes"><select id="cat"><option value="all">All (${TOTAL})</option><option value="fav" ${S.cat=='fav'?'selected':''}>Favorites</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${S.cat==k?'selected':''}>${v[0]} (${THEMES.filter(x=>x.cat==k).length})</option>`).join('')}</select><select id="mood">${['all','light','dark','cute','futuristic','elegant','playful','calm','nostalgic'].map(x=>`<option ${S.mood==x?'selected':''}>${x}</option>`).join('')}</select><select id="sort"><option value="az">A–Z</option><option value="rand" ${S.sort=='rand'?'selected':''}>Shuffled</option></select><button class="btn" id="rnd">Random</button></div><p>${a.length} of ${TOTAL} themes · Featured today: <b>${THEMES[new Date().getDate()*7%TOTAL].name}</b></p><div class="grid">${a.map(x=>`<button class="card" data-id="${x.id}">${swatch(x.t)}<div class="m"><b>${esc(x.name)}</b><small>${CATS[x.cat][0]}${S.fav.includes(x.id)?' ★':''}</small></div></button>`).join('')||'<p>No themes match. Try clearing filters.</p>'}</div>`}
lib.after=()=>{const m=$('#mn');$('#q').oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)};['cat','mood','sort'].forEach(k=>$('#'+k).onchange=e=>{S[k]=e.target.value;render()});$('#rnd').onclick=rnd;m.querySelectorAll('.card').forEach(c=>c.onclick=()=>{use(c.dataset.id);go('studio')})};
function rnd(){use(THEMES[Math.random()*TOTAL|0].id);if(S.page=='lib')S.page='studio';render()}
function studio(){const th=find(S.cur),t=tok(th),isF=S.fav.includes(th.id);
const sl=(k,mn,mx,l)=>`<label>${l}<input type="range" min="${mn}" max="${mx}" value="${t[k]}" data-k="${k}"><output>${t[k]}</output></label>`,cl=(k,l)=>`<label>${l}<input type="color" value="${String(t[k]).slice(0,7)}" data-k="${k}" aria-label="${l}"><code data-c="${k}">${String(t[k]).slice(0,7)}</code></label>`;
return`<div class="bar"><h2 style="margin:0;flex:1">${esc(th.name)}</h2><button class="btn o" id="fv">${isF?'★ Unfavorite':'☆ Favorite'} (F)</button><button class="btn" id="rnd">Random (R)</button></div><div class="cols"><div class="g ctl"><b>Customize</b>${cl('pr','Primary')}${cl('ac','Accent')}${cl('bg','Background')}${cl('sf','Surface')}${cl('tx','Text')}${sl('r',0,40,'Radius')}${sl('bw',0,6,'Border')}${sl('bl',0,30,'Blur')}${sl('sp',8,40,'Spacing')}${sl('fs',12,20,'Font size')}${sl('gr',0,.5,'Grain')}<label>Body font<select data-f="f">${Object.entries(FONTS).map(([k,v])=>`<option value="${v}" ${t.f==v?'selected':''}>${k}</option>`).join('')}</select></label><label>Heading font<select data-f="hf">${Object.entries(FONTS).map(([k,v])=>`<option value="${v}" ${t.hf==v?'selected':''}>${k}</option>`).join('')}</select></label><div class="bar"><button class="btn o" id="un">Undo</button><button class="btn o" id="re">Redo</button><button class="btn o" id="rs">Reset</button></div><b>Presets</b><div class="bar">${['Soft','Bold','Minimal','Ultra-Dark','Pastel'].map(p=>`<button class="btn o" data-ps="${p}">${p}</button>`).join('')}</div><b>Export</b><div class="bar"><button class="btn o" id="xc">Copy CSS</button><button class="btn o" id="xd">.css</button><button class="btn o" id="xj">JSON</button></div><small>Exports design tokens only, not a full website.</small></div>
<div><div class="bar"><select id="md">${[['full','Full site'],['comp','Components'],['dash','Dashboard']].map(x=>`<option value="${x[0]}" ${S.mode==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><select id="vw">${[['100%','Desktop'],['768px','Tablet'],['375px','Mobile']].map(x=>`<option value="${x[0]}" ${S.w==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><select id="cp"><option value="">Compare with…</option>${THEMES.map(x=>`<option value="${x.id}" ${S.cmp==x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
<div style="display:grid;grid-template-columns:${S.cmp?'repeat(auto-fit,minmax(300px,1fr))':'1fr'};gap:10px"><div class="vp" style="width:${S.w}">${preview(th)}</div>${S.cmp?`<div class="vp" style="width:${S.w}">${preview(find(S.cmp))}</div>`:''}</div></div></div>`}
function setOv(patch){const id=S.cur;S.hist.push(JSON.stringify(S.ov[id]||{}));S.redo=[];S.ov[id]={...(S.ov[id]||{}),...patch};SV('ov',S.ov)}
studio.after=()=>{const m=$('#mn'),th=find(S.cur);const rr=()=>{const y=scrollY;render();scrollTo(0,y)};$('#rnd').onclick=rnd;$('#fv').onclick=fav;
m.querySelectorAll('input[data-k]').forEach(i=>i.onchange=()=>{setOv({[i.dataset.k]:i.type=='range'?+i.value:i.value});rr()});m.querySelectorAll('select[data-f]').forEach(s=>s.onchange=()=>{setOv({[s.dataset.f]:s.value});rr()});
$('#un').onclick=()=>{if(!S.hist.length)return toast('Nothing to undo');S.redo.push(JSON.stringify(S.ov[S.cur]||{}));S.ov[S.cur]=JSON.parse(S.hist.pop());SV('ov',S.ov);rr()};
$('#re').onclick=()=>{if(!S.redo.length)return toast('Nothing to redo');S.hist.push(JSON.stringify(S.ov[S.cur]||{}));S.ov[S.cur]=JSON.parse(S.redo.pop());SV('ov',S.ov);rr()};
$('#rs').onclick=()=>{if(confirm('Reset this theme to defaults?')){setOv({});S.ov[S.cur]={};SV('ov',S.ov);rr()}};
const P={Soft:{r:24,bw:1,sh:'0 8px 24px #0002',gr:0},Bold:{bw:4,r:2,sh:'5px 5px 0 #000'},Minimal:{r:2,bw:1,sh:'none',gr:0,sp:28},'Ultra-Dark':{bg:'#000000',sf:'#0c0c10',tx:'#e8e8f0'},Pastel:{bg:'#fff1f7',sf:'#ffffff',tx:'#4a3550',pr:'#f9a8d4',ac:'#a5b4fc'}};
m.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{setOv(P[b.dataset.ps]);rr()});
$('#xc').onclick=()=>copy(css(th));$('#xd').onclick=()=>dl(th.name.replace(/\W+/g,'-')+'.css',css(th));$('#xj').onclick=()=>dl(th.name.replace(/\W+/g,'-')+'.json',JSON.stringify({name:th.name,category:CATS[th.cat]?.[0],tokens:tok(th)},null,2));
$('#md').onchange=e=>{S.mode=e.target.value;rr()};$('#vw').onchange=e=>{S.w=e.target.value;rr()};$('#cp').onchange=e=>{S.cmp=e.target.value||null;rr()}};
function fav(){const i=S.fav.indexOf(S.cur);i<0?S.fav.push(S.cur):S.fav.splice(i,1);SV('fav',S.fav);render()}
function mixer(){const a=find(S.cur),bId=S.mixB||THEMES[(THEMES.indexOf(a)+17)%TOTAL].id,b=find(bId),mt=mixT(a,b);
return`<h2>Hybrid Mixer</h2><div class="bar"><select id="ma">${THEMES.map(x=>`<option value="${x.id}" ${x.id==a.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select> + <select id="mb">${THEMES.map(x=>`<option value="${x.id}" ${x.id==bId?'selected':''}>${esc(x.name)}</option>`).join('')}</select><label>Blend <input type="range" id="mi" value="${S.mixI}"> ${S.mixI}%</label>${[['pal','Palette'],['type','Type'],['shape','Shape']].map(x=>`<label><input type="checkbox" data-mx="${x[0]}" ${S.mix[x[0]]?'checked':''}> ${x[1]}</label>`).join('')}<button class="btn" id="sv">Save hybrid</button></div><div class="vp">${preview({id:'mx',name:a.name+' × '+b.name,t:mt},'full')}</div>${S.saved.length?`<h3>Saved hybrids</h3>${S.saved.map(x=>`<div class="bar"><button class="btn o" data-us="${x.id}">${esc(x.name)}</button><button class="btn o" data-ds="${x.id}">Delete</button></div>`).join('')}`:''}`}
function mixT(a,b){const A=tok(a),B=tok(b),k=S.mixI/100,t={...A};if(S.mix.pal)['bg','tx','pr','ac'].forEach(c=>t[c]=mixc(A[c],B[c],k));if(S.mix.pal){t.sf=mixc(A.sf.slice(0,7),B.sf.slice(0,7),k)}
if(S.mix.type){t.f=k>.5?B.f:A.f;t.hf=B.hf}if(S.mix.shape){['r','bw','bl'].forEach(c=>t[c]=Math.round(A[c]*(1-k)+B[c]*k));t.sh=k>.5?B.sh:A.sh}
if(lum(t.bg)>.4==lum(t.tx)>.4)t.tx=onc(t.bg);return t}
mixer.after=()=>{const R=()=>{const y=scrollY;render();scrollTo(0,y)};$('#ma').onchange=e=>{S.cur=e.target.value;R()};$('#mb').onchange=e=>{S.mixB=e.target.value;R()};$('#mi').onchange=e=>{S.mixI=+e.target.value;R()};document.querySelectorAll('[data-mx]').forEach(c=>c.onchange=()=>{S.mix[c.dataset.mx]=c.checked?1:0;R()});
$('#sv').onclick=()=>{const n=prompt('Name your hybrid:');if(!n)return;const a=find(S.cur),b=find(S.mixB||THEMES[(THEMES.indexOf(a)+17)%TOTAL].id);S.saved.push({id:'u'+Date.now(),name:n,cat:'H',t:mixT(a,b)});SV('saved',S.saved);R()};
document.querySelectorAll('[data-us]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.us;go('studio')});document.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{if(confirm('Delete this hybrid?')){S.saved=S.saved.filter(x=>x.id!=b.dataset.ds);SV('saved',S.saved);R()}})};
function promptPg(){const th=find(S.cur),t=tok(th);return`<h2>Prompt Generator</h2><p>Generated locally from theme data. No AI is called.</p><div class="bar"><select id="ty">${['portfolio','dashboard','SaaS','blog','e-commerce','game','study platform','AI agent','landing page'].map(x=>`<option>${x}</option>`).join('')}</select><select id="sk">${['React + Vite','Next.js','Plain HTML/CSS/JS'].map(x=>`<option>${x}</option>`).join('')}</select><select id="an"><option>subtle animation</option><option>rich animation</option><option>no animation</option></select><select id="mf"><option>mobile-first</option><option>desktop-first</option></select><button class="btn" id="gp">Generate</button></div><label>Theme <select id="pt">${THEMES.map(x=>`<option value="${x.id}" ${x.id==th.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><textarea id="po" aria-label="Prompt"></textarea><div class="bar"><button class="btn" id="cp1">Copy</button><button class="btn o" id="dp">Download</button></div>`}
promptPg.after=()=>{const g=()=>{const th=find($('#pt').value),t=tok(th);$('#po').value=`Build a ${$('#ty').value} website in the "${th.name}" aesthetic using ${$('#sk').value}. Approach: ${$('#mf').value}, with ${$('#an').value}.\n\n## Design direction\nCategory: ${CATS[th.cat][0]}. ${t.dark?'Dark':'Light'} interface. Evoke the ${th.name} look through color, type, shape and texture.\n\n## Design tokens\n- Background ${t.bg}, surface ${t.sf}, text ${t.tx}\n- Primary ${t.pr}, accent ${t.ac}\n- Body font: ${t.f}\n- Heading font: ${t.hf}\n- Radius ${t.r}px, border ${t.bw}px, shadow ${t.sh}\n- Blur ${t.bl}px, grain ${t.gr}\n\n## Layout & components\nNavigation, hero, cards, forms, table, modal, tabs, accordion and footer, all styled via CSS variables.\n\n## Interactions\nHover and focus states in keeping with the theme; ${$('#an').value}; respect prefers-reduced-motion.\n\n## Responsiveness\nCheck 320, 375, 390, 430, 768 and 1280px widths. No horizontal overflow.\n\n## Performance & accessibility\nWCAG AA contrast, visible focus rings, semantic HTML, no unnecessary dependencies.\n\n## Implementation\nExpose the tokens as CSS custom properties; keep components reusable and themeable.`};g();document.querySelectorAll('#ty,#sk,#an,#mf,#pt').forEach(e=>e.onchange=g);$('#gp').onclick=g;$('#cp1').onclick=()=>copy($('#po').value,'Prompt copied');$('#dp').onclick=()=>dl('theme-prompt.txt',$('#po').value)};
function pal(){const t=tok(find(S.cur));const hsl=h=>{const r=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255),mx=Math.max(...r),mn=Math.min(...r),l=(mx+mn)/2,d=mx-mn;let H=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));H=mx==r[0]?((r[1]-r[2])/d)%6:mx==r[1]?(r[2]-r[0])/d+2:(r[0]-r[1])/d+4}return[(H*60+360)%360,s*100,l*100]};const[h,s,l]=hsl(t.pr);const rows=[['Complementary',[0,180]],['Analogous',[-30,0,30]],['Triadic',[0,120,240]]];
return`<h2>Palette Lab</h2><p>Based on the active primary <code>${t.pr}</code>. Click a swatch to copy HEX, then apply it.</p>${rows.map(([n,o])=>`<h3>${n}</h3><div class="sws">${o.map(d=>{const c=hx((h+d+360)%360,s,l);const[r,g,b]=[1,3,5].map(i=>parseInt(c.substr(i,2),16));return`<button style="background:${c};color:${onc(c)}" data-c="${c}" title="rgb(${r},${g},${b})">${c}<br>Aa ${(((Math.max(lum(c),lum(t.bg))+.05)/(Math.min(lum(c),lum(t.bg))+.05))).toFixed(1)}:1</button>`}).join('')}</div>`).join('')}<p>Click a swatch to copy; Shift-click to set as accent.</p>`}
pal.after=()=>document.querySelectorAll('[data-c]').forEach(b=>b.onclick=e=>{if(e.shiftKey){setOv({ac:b.dataset.c});toast('Accent applied')}else copy(b.dataset.c,b.dataset.c+' copied')});
function fav_(){const r=LS('recent',[]).map(find);const f=S.fav.map(find);const g=a=>a.length?`<div class="grid">${a.map(x=>`<button class="card" data-id="${x.id}">${swatch(x.t)}<div class="m"><b>${esc(x.name)}</b></div></button>`).join('')}</div>`:'<p>Nothing here yet. Press F in the Studio to favorite a theme.</p>';
return`<h2>Favorites</h2>${g(f)}<h3>Recently viewed</h3>${g(r)}<div class="bar"><button class="btn o" id="ex">Export JSON</button><button class="btn o" id="im">Import JSON</button></div>`}
fav_.after=()=>{document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{use(c.dataset.id);go('studio')});$('#ex').onclick=()=>dl('themeverse-data.json',JSON.stringify({fav:S.fav,saved:S.saved}));$('#im').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>i.files[0].text().then(x=>{try{const d=JSON.parse(x);if(Array.isArray(d.fav))S.fav=d.fav.filter(v=>typeof v=='string'&&THEMES.some(t=>t.id==v));if(Array.isArray(d.saved))S.saved=d.saved.filter(v=>v&&typeof v.name=='string'&&v.t&&typeof v.t.bg=='string'&&/^#[0-9a-f]{6}/i.test(v.t.bg)).map(v=>({id:'u'+Math.random().toString(36).slice(2),name:v.name,cat:'H',t:v.t}));SV('fav',S.fav);SV('saved',S.saved);toast('Imported');render()}catch(e){toast('Invalid JSON file')}});i.click()}};
const fav2=fav_;function help(){return`<h2>Help</h2><div class="g"><p><b>Ctrl/Cmd+K</b> search · <b>R</b> random theme · <b>F</b> favorite · <b>Esc</b> close dialogs</p><p>Everything is saved locally in your browser. No account, no tracking.</p><p>Theme count is computed live: <b>${TOTAL}</b> themes across ${Object.keys(CATS).length} categories.</p></div>`}
const R2={lib,studio,mixer,prompt:promptPg,pal,fav:fav2,help};
function render(){$('#nv').innerHTML='<h1>THEMEVERSE</h1>'+PAGES.map(p=>`<button class="${S.page==p[0]?'on':''}" data-p="${p[0]}">${p[1]}</button>`).join('');const R=R2[S.page];$('#mn').innerHTML=R();if(R.after)R.after()}
$('#nv').onclick=e=>{const p=e.target.dataset.p;if(p)go(p)};
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if((e.ctrlKey||e.metaKey)&&e.key=='k'){e.preventDefault();S.page='lib';render();$('#q').focus()}else if(!typing&&!e.ctrlKey&&!e.metaKey){if(e.key=='r')rnd();if(e.key=='f'&&S.page=='studio')fav()}if(e.key=='Escape')document.activeElement.blur()});
render();
</script></body></html>
